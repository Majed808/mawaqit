<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مواقيت</title>
<meta name="description" content="تذكير بمواقيت الصلاة والإقامة وفق منصة منهاج — رابطة العالم الإسلامي">
<meta name="theme-color" content="#145a45" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c1a15" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مواقيت">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="src/app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-gear" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></symbol>
  <symbol id="i-bell-off" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M8.7 3.2A6 6 0 0 1 18 8c0 3 .5 5 1.2 6.4M17 17H3s3-2 3-9c0-.6.1-1.2.2-1.7M10.3 21a1.9 1.9 0 0 0 3.4 0M3 3l18 18"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M12 11v5.5M12 7.6v.1"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="m9 6 6 6-6 6"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v13"/></symbol>
  <symbol id="i-install" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0-4.5-4.5M12 15l4.5-4.5M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></symbol>
  <symbol id="i-locate" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="2.4" fill="currentColor"/><path stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
</svg>

<div id="app" class="app">
  <!-- HOME -->
  <main id="home" class="view view-home" aria-live="polite">
    <header class="topbar">
      <button class="place" id="placeBtn" type="button">
        <svg class="ic"><use href="#i-pin"/></svg><span id="placeName">—</span>
      </button>
      <div class="actions">
        <button class="icon-btn" id="installBtn" type="button" hidden><svg class="ic"><use href="#i-install"/></svg></button>
        <button class="icon-btn" id="aboutBtn" type="button"><svg class="ic"><use href="#i-info"/></svg></button>
        <button class="icon-btn" id="settingsBtn" type="button"><svg class="ic"><use href="#i-gear"/></svg></button>
      </div>
    </header>
    <p class="dates"><span id="hijri"></span><span class="dot">•</span><span id="greg"></span></p>

    <section class="hero" id="hero">
      <div class="hero-pattern" aria-hidden="true"></div>
      <div class="hero-top">
        <span class="label" id="nextLabel"></span>
        <span class="hero-time" id="nextTime"></span>
      </div>
      <h1 class="hero-name" id="nextName">—</h1>
      <div class="countdown" id="countdown" dir="ltr">--:--:--</div>
      <div class="progress"><span id="progress"></span></div>
    </section>

    <button class="status" id="statusBtn" type="button"><span class="led"></span><span id="statusText"></span></button>

    <ol class="list" id="list"></ol>

    <p class="foot" id="foot"></p>
    <p class="alert" id="alert" hidden></p>
  </main>

  <!-- SETTINGS -->
  <section id="settings" class="view sheet" hidden>
    <header class="sheet-head">
      <button class="icon-btn back" data-back type="button"><svg class="ic"><use href="#i-back"/></svg></button>
      <h2 data-t="settings"></h2><span></span>
    </header>
    <div class="sheet-body" id="settingsBody"></div>
  </section>

  <!-- ABOUT -->
  <section id="about" class="view sheet" hidden>
    <header class="sheet-head">
      <button class="icon-btn back" data-back type="button"><svg class="ic"><use href="#i-back"/></svg></button>
      <h2 data-t="about"></h2><span></span>
    </header>
    <div class="sheet-body prose" id="aboutBody"></div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>
</div>
<noscript>يتطلب هذا التطبيق تفعيل JavaScript.</noscript>
<script type="module" src="src/app.js"></script>
</body>
</html>
