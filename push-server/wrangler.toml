name = "mawaqit-push"
main = "src/worker.js"
compatibility_date = "2025-10-01"

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "mawaqit-push"
database_id = "REPLACE_WITH_D1_ID"

[vars]
ALLOWED_ORIGINS = "https://majed808.github.io,http://localhost:5173,http://localhost:5174"
VAPID_SUBJECT = "https://majed808.github.io/mawaqit/"
VAPID_PUBLIC_KEY = "REPLACE_WITH_VAPID_PUBLIC_KEY"
# secret (not in this file): VAPID_PRIVATE_JWK  →  npx wrangler secret put VAPID_PRIVATE_JWK
